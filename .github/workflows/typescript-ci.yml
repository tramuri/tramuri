name: TypeScript CLI CI

on:
  pull_request:
    paths:
      - "packages/typescript/**"
      - ".github/workflows/typescript-ci.yml"
      - ".github/workflows/npm-publish.yml"
      - ".github/dependabot.yml"
      - "LICENSE"
  push:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - ".github/workflows/typescript-ci.yml"
      - ".github/workflows/npm-publish.yml"
      - ".github/dependabot.yml"
      - "LICENSE"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: typescript-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-tests:
    name: Runtime checks (${{ matrix.os }}, Node ${{ matrix.node }}.x, Bun 1.3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run ci

  package-consumer:
    name: npm tarball and consumer install
    needs: runtime-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Pack and inspect the clean tarball
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          package_name="$(node -p "require('./package.json').name.replace('@', '').replace('/', '-')")"
          package_version="$(node -p "require('./package.json').version")"
          tarball="$RUNNER_TEMP/${package_name}-${package_version}.tgz"
          tar -tzf "$tarball" > "$RUNNER_TEMP/npm-pack-files.txt"
          grep -Fx "package/dist/cli.js" "$RUNNER_TEMP/npm-pack-files.txt"
          grep -Fx "package/LICENSE" "$RUNNER_TEMP/npm-pack-files.txt"
          if grep -Eq '^package/(src|tests)/' "$RUNNER_TEMP/npm-pack-files.txt"; then
            echo "tarball contains development-only source or tests" >&2
            exit 1
          fi
      - name: Install packed tarball in a clean consumer
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name.replace('@', '').replace('/', '-')")"
          package_version="$(node -p "require('./package.json').version")"
          tarball="$RUNNER_TEMP/${package_name}-${package_version}.tgz"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --offline --ignore-scripts --no-audit --no-fund "$tarball"
          ./node_modules/.bin/tramuri-cli perspective choose --perspective product_engineer --json
          ./node_modules/.bin/tramuri-ts perspective choose --perspective mixed --json
          bun ./node_modules/@tramuri/typescript/dist/cli.js perspective choose --perspective fde --json

  required-check:
    name: TypeScript required checks
    if: always()
    needs: [runtime-tests, package-consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail if any required job failed or was skipped
        run: |
          if [ "${{ needs.runtime-tests.result }}" != "success" ]; then
            echo "runtime-tests did not succeed" >&2
            exit 1
          fi
          if [ "${{ needs.package-consumer.result }}" != "success" ]; then
            echo "package-consumer did not succeed" >&2
            exit 1
          fi

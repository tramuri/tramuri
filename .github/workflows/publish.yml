name: Publish Python package

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  test:
    name: Test tagged source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Check tag, Cargo version, and changelog entry
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match Cargo workspace version {version!r}")
          changelog = Path("CHANGELOG.md").read_text()
          if not re.search(rf"^## \[{re.escape(version)}\](?:\s|$)", changelog, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md must contain a released section for {version}")
          PY
      - run: uv sync --locked --no-install-project --python 3.11
      - run: cargo build --locked --package tramuri-cli
      - run: uv run --no-sync maturin develop --locked --manifest-path tramuri/bindings/python/Cargo.toml
      - name: Run Rust and Python tests with CLI/SDK parity
        env:
          TRAMURI_CLI: ${{ github.workspace }}/target/debug/tramuri
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          uv run --no-sync pytest

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-26-intel]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --no-install-project --python 3.11
      - name: Build manylinux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1
        with:
          command: build
          args: --locked --release --manifest-path tramuri/bindings/python/Cargo.toml --interpreter python3.11 --out dist
          maturin-version: 1.15.0
          manylinux: 2014
      - name: Build Windows or macOS wheel
        if: runner.os != 'Linux'
        run: uv run --no-sync maturin build --locked --release --manifest-path tramuri/bindings/python/Cargo.toml --interpreter python --out dist
      - name: Select wheel for isolated installation test
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found: {wheels}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TRAMURI_WHEEL={wheels[0].resolve()}\n")
      - run: uv run --no-sync pytest tramuri/tests/python/test_install.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --no-install-project --python 3.11
      - run: uv run --no-sync maturin sdist --manifest-path tramuri/bindings/python/Cargo.toml --out dist
      - name: Verify source distribution contents and Cargo workspace
        shell: python {0}
        run: |
          import subprocess
          import tarfile
          from pathlib import Path
          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one sdist, found: {archives}")
          with tarfile.open(archives[0], "r:gz") as archive:
              names = archive.getnames()
          required = (
              "Cargo.toml", "Cargo.lock", "pyproject.toml", "LICENSE",
              "tramuri/bindings/python/Cargo.toml", "tramuri/crates/tramuri-core/src/discovery.rs",
              "tramuri/crates/tramuri-core/src/hash_status.rs", "tramuri/python/tramuri/__init__.py",
              "tramuri/python/tramuri/py.typed", "tramuri/python/tramuri/_cli.py", "tramuri/python/tramuri/skills/tramuri/SKILL.md",
              "tramuri/python/tramuri/skills/tramuri-start/SKILL.md",
              "tramuri/python/tramuri/skills/tramuri-product-engineering/SKILL.md",
              "tramuri/python/tramuri/skills/tramuri-discovery/SKILL.md",
              "tramuri/python/tramuri/skills/tramuri-missions/SKILL.md",
              "tramuri/python/tramuri/skills/tramuri-integrity/SKILL.md",
              "tramuri/python/tramuri/skills/tramuri/references/project-discovery.md",
              "tramuri/python/tramuri/skills/tramuri/references/knowledge.md",
              "tramuri/python/tramuri/skills/tramuri/references/missions-and-outcomes.md",
              "tramuri/python/tramuri/skills/tramuri/references/context-and-evidence.md",
              "tramuri/python/tramuri/skills/tramuri/references/platform-integrations.md",
              "tramuri/always_on/agents-md.md",
              "tramuri/always_on/copilot-instructions.md",
              "tramuri/always_on/claude-md.md",
              "tramuri/always_on/gemini-md.md",
          )
          missing = [path for path in required if not any(name.endswith(path) for name in names)]
          if missing:
              raise SystemExit(f"sdist is missing files: {missing}")
          destination = Path("target/sdist-check")
          destination.mkdir(parents=True, exist_ok=True)
          subprocess.run(["tar", "-xzf", str(archives[0]), "-C", str(destination)], check=True)
          source_root = destination / archives[0].name.removesuffix(".tar.gz")
          subprocess.run(["cargo", "metadata", "--no-deps", "--format-version", "1",
                          "--manifest-path", str(source_root / "tramuri/bindings/python/Cargo.toml")],
                         check=True, capture_output=True, text=True)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  validate-distributions:
    name: Validate distributions
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Require wheel and source distribution
        run: |
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: validate-distributions
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Install and smoke-test TestPyPI package
    needs: publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the tagged version from TestPyPI
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          uv venv --python 3.11 .venv-testpypi
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --python .venv-testpypi --index-url https://test.pypi.org/simple/ --no-deps "tramuri==$VERSION"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 10
          done
          .venv-testpypi/bin/python - <<'PY'
          import tempfile
          import subprocess
          import json
          from pathlib import Path
          import tramuri

          workspace = Path(tempfile.mkdtemp())
          report = tramuri.init(workspace)
          assert report["schema_version"] == 10
          assert Path(report["database_path"]).parent.name == "database"
          assert tramuri.__version__
          product_skill = Path(tramuri.__file__).parent / "skills" / "tramuri-product-engineering" / "SKILL.md"
          assert product_skill.is_file()
          guided = tramuri.mission_start(workspace, objective="Create a SaaS for selling online courses")
          assert guided["workflow"]["next_activity"] == "product_framing"
          command = Path(".venv-testpypi/bin/tramuri")
          version = subprocess.run([command, "--version"], check=True, capture_output=True, text=True)
          assert version.stdout.strip().startswith("tramuri ")
          scan = subprocess.run(
              [command, "scan", str(workspace), "--json"], check=True, capture_output=True, text=True
          )
          assert json.loads(scan.stdout)["complete"] is True
          print(f"Imported Tramuri {tramuri.__version__} from TestPyPI")
          PY

  publish-pypi:
    name: Publish to PyPI (approval required)
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

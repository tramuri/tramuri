[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tramuri"
version = "0.13.3"
description = "From intent to a verifiable product definition with local-first agent integrations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Tramuri maintainers" }]
keywords = ["product-engineering", "product-management", "agents", "cli", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "jinja2>=3.1,<4",
  "rich>=13.9,<15",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/tramuri/tramuri"
Documentation = "https://github.com/tramuri/tramuri/tree/main/docs"
Issues = "https://github.com/tramuri/tramuri/issues"
Changelog = "https://github.com/tramuri/tramuri/blob/main/CHANGELOG.md"

[project.scripts]
tramuri = "tramuri.cli.app:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pre-commit>=4,<5",
  "ruff>=0.8,<1",
  "twine>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tramuri"]
exclude = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/README.pt-BR.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
exclude = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/tramuri"]
branch = true
parallel = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tramuri"]
